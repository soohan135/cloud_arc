<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchMate</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2f5bea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:18px; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:340px 1fr; gap:16px; }
  @media (max-width:800px){ main{ grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  input, textarea, select { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  textarea { min-height:70px; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; margin:8px 0; }
  .paper { padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .paper .t { font-weight:600; cursor:pointer; }
  .paper.sel .t { color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:#eef; }
  .tag.indexed { background:#dcfce7; } .tag.failed { background:#fee2e2; }
  .tabs button { background:#eef2ff; color:var(--accent); }
  .tabs button.on { background:var(--accent); color:#fff; }
  #out .msg { margin:12px 0; padding:12px; border-radius:8px; background:#f9fafb; border:1px solid var(--line); }
  #out .q { background:#eef2ff; }
  .src { font-size:12px; color:var(--muted); margin-top:6px; }
  #auth { max-width:360px; margin:60px auto; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header><b>📚 ResearchMate</b><span id="who" class="muted"></span></header>

<div id="auth" class="card">
  <h3>로그인</h3>
  <input id="email" placeholder="이메일" type="email">
  <div class="row"><input id="pw" placeholder="비밀번호" type="password" onkeydown="if(event.key==='Enter')login()"></div>
  <div class="row"><button onclick="login()">로그인</button></div>
  <div id="authMsg" class="muted">계정은 관리자에게 요청하세요.</div>
</div>

<main id="app" class="hidden">
  <section class="card">
    <h3>논문 검색 (arXiv)</h3>
    <div class="row"><input id="q" placeholder="예: retrieval augmented generation" onkeydown="if(event.key==='Enter')search()"><button onclick="search()">검색</button></div>
    <div class="muted">검색된 논문은 저장 후 자동으로 PDF 수집·임베딩됩니다 (1~2분).</div>
    <div class="row"><button class="ghost" onclick="loadPapers()">저장된 논문 새로고침</button></div>
    <div id="papers"></div>
  </section>

  <section class="card">
    <div class="tabs row">
      <button data-m="chat" class="on" onclick="setMode('chat')">질문하기</button>
      <button data-m="summarize" onclick="setMode('summarize')">요약</button>
      <button data-m="cite" onclick="setMode('cite')">인용문 초안</button>
    </div>
    <div class="muted" id="selInfo">선택된 논문: 없음 (질문은 전체 논문 대상)</div>
    <div class="row"><textarea id="input" placeholder="질문을 입력하세요"></textarea></div>
    <div class="row"><button id="go" onclick="run()">보내기</button></div>
    <div id="out"></div>
  </section>
</main>

<script>
const C = window.RM_CONFIG || {};
let token = localStorage.getItem("rm_token"), selected = null, mode = "chat";

async function cognito(target, body) {
  const r = await fetch(`https://cognito-idp.${C.region}.amazonaws.com/`, {
    method: "POST",
    headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": `AWSCognitoIdentityProviderService.${target}` },
    body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.message || j.__type);
  return j;
}
async function login() {
  try {
    const j = await cognito("InitiateAuth", { ClientId: C.clientId, AuthFlow: "USER_PASSWORD_AUTH", AuthParameters: { USERNAME: email.value, PASSWORD: pw.value } });
    token = j.AuthenticationResult.IdToken; localStorage.setItem("rm_token", token); localStorage.setItem("rm_email", email.value);
    showApp();
  } catch (e) { authMsg.textContent = e.message; }
}
function logout() { localStorage.removeItem("rm_token"); location.reload(); }
function showApp() {
  auth.classList.add("hidden"); app.classList.remove("hidden");
  who.innerHTML = `${localStorage.getItem("rm_email") || ""} <a href="#" onclick="logout()">로그아웃</a>`;
  loadPapers();
}

async function api(path, body) {
  const r = await fetch(`/api/${path}`, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { logout(); return; }
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(j.error || j.message || `HTTP ${r.status}`);
  return j;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function renderPapers(list) {
  papers.innerHTML = list.map(p => `
    <div class="paper ${selected?.paper_id === p.paper_id ? "sel" : ""}">
      <div class="t" onclick='pick(${JSON.stringify({ paper_id: p.paper_id, title: p.title }).replace(/'/g, "&#39;")})'>${esc(p.title)}</div>
      <div class="muted">${esc((p.authors || []).slice(0, 3).join(", "))} · ${esc(p.published)} · <span class="tag ${p.status}">${p.status}</span> · <a href="${esc(p.url)}" target="_blank">arXiv</a></div>
    </div>`).join("") || "<div class='muted'>없음</div>";
}
async function search() {
  papers.innerHTML = "<div class='muted'>검색 중…</div>";
  try { renderPapers((await api("search", { query: q.value })).papers); } catch (e) { papers.textContent = e.message; }
}
async function loadPapers() { try { renderPapers((await api("papers")).papers); } catch (e) { papers.textContent = e.message; } }
function pick(p) {
  selected = selected?.paper_id === p.paper_id ? null : p;
  selInfo.textContent = `선택된 논문: ${selected ? selected.title : "없음 (질문은 전체 논문 대상)"}`;
  document.querySelectorAll(".paper").forEach(el => el.classList.toggle("sel", selected && el.querySelector(".t").textContent === selected.title));
}
function setMode(m) {
  mode = m;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  input.placeholder = { chat: "질문을 입력하세요", summarize: "(왼쪽에서 논문 선택 후 보내기)", cite: "내 연구 내용을 간단히 설명하세요 (왼쪽에서 인용할 논문 선택)" }[m];
}
function addMsg(html, cls = "") { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; out.prepend(d); return d; }
function srcHtml(s = []) {
  return s.map(x => `<div class="src">[${x.n}] <a href="${esc(x.url)}" target="_blank">${esc(x.title)}</a> (${esc(x.published)}) — “${esc(x.snippet)}…”</div>`).join("");
}
async function run() {
  const text = input.value.trim();
  if ((mode !== "chat") && !selected) return alert("왼쪽 목록에서 논문을 먼저 선택하세요.");
  if (mode !== "summarize" && !text) return;
  go.disabled = true;
  const wait = addMsg("생각 중…");
  if (text) addMsg(esc(text), "q");
  try {
    let r, html;
    if (mode === "chat") { r = await api("chat", { question: text, paper_id: selected?.paper_id }); html = marked.parse(r.answer) + srcHtml(r.sources); }
    if (mode === "summarize") { r = await api("summarize", { paper_id: selected.paper_id }); html = marked.parse(r.summary); }
    if (mode === "cite") { r = await api("cite", { paper_id: selected.paper_id, my_research: text }); html = marked.parse(r.draft) + srcHtml(r.sources); }
    wait.innerHTML = html; input.value = "";
  } catch (e) { wait.textContent = "오류: " + e.message; }
  go.disabled = false;
}
if (C.local) { token = "local"; localStorage.setItem("rm_email", "로컬 개발 모드"); }
if (token) showApp();
</script>
</body>
</html>
